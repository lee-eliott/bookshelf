<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Icon concepts — Bookshelf</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 48px 24px;
    }
    h1 { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #78350f; }
    .row {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .concept {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #78716c;
    }
    .sizes {
      display: flex;
      gap: 16px;
      align-items: flex-end;
    }
    .sizes img { display: block; border-radius: calc(var(--r) * 1px); }
    .s512 { width: 180px; height: 180px; --r: 38; }
    .s192 { width: 96px;  height: 96px;  --r: 20; }
    .s64  { width: 64px;  height: 64px;  --r: 14; }
    .s32  { width: 32px;  height: 32px;  --r: 7; }
    .s16  { width: 16px;  height: 16px;  --r: 3; }
    .caption { font-size: 9px; color: #a8a29e; text-align: center; margin-top: -10px; }
  </style>
</head>
<body>
  <h1>Bookshelf — Concepts icône</h1>

  <div class="row">

    <!-- Concept A -->
    <div class="concept">
      <div class="label">A — Bibliothèque</div>
      <div class="sizes">
        <div>
          <img class="s512" src="icon-concept-a.svg"/>
          <p class="caption">512</p>
        </div>
        <div>
          <img class="s192" src="icon-concept-a.svg"/>
          <p class="caption">192</p>
        </div>
        <div>
          <img class="s64" src="icon-concept-a.svg"/>
          <p class="caption">64</p>
        </div>
        <div>
          <img class="s32" src="icon-concept-a.svg"/>
          <p class="caption">32</p>
        </div>
        <div>
          <img class="s16" src="icon-concept-a.svg"/>
          <p class="caption">16</p>
        </div>
      </div>
    </div>

    <!-- Concept B -->
    <div class="concept">
      <div class="label">B — Livre ouvert</div>
      <div class="sizes">
        <div>
          <img class="s512" src="icon-concept-b.svg"/>
          <p class="caption">512</p>
        </div>
        <div>
          <img class="s192" src="icon-concept-b.svg"/>
          <p class="caption">192</p>
        </div>
        <div>
          <img class="s64" src="icon-concept-b.svg"/>
          <p class="caption">64</p>
        </div>
        <div>
          <img class="s32" src="icon-concept-b.svg"/>
          <p class="caption">32</p>
        </div>
        <div>
          <img class="s16" src="icon-concept-b.svg"/>
          <p class="caption">16</p>
        </div>
      </div>
    </div>

    <!-- Concept C -->
    <div class="concept">
      <div class="label">C — Couverture</div>
      <div class="sizes">
        <div>
          <img class="s512" src="icon-concept-c.svg"/>
          <p class="caption">512</p>
        </div>
        <div>
          <img class="s192" src="icon-concept-c.svg"/>
          <p class="caption">192</p>
        </div>
        <div>
          <img class="s64" src="icon-concept-c.svg"/>
          <p class="caption">64</p>
        </div>
        <div>
          <img class="s32" src="icon-concept-c.svg"/>
          <p class="caption">32</p>
        </div>
        <div>
          <img class="s16" src="icon-concept-c.svg"/>
          <p class="caption">16</p>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
